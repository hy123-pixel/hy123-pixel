    <text x="64" y="300" fill="#647891" font-size="14">从桌面端管理连接、</text><text x="64" y="321" fill="#647891" font-size="14">终端和日常运维任务</text>
    <rect x="64" y="353" width="150" height="1" fill="#e7edf4"/>
