  <text x="600" y="542" text-anchor="middle" fill="#607895" font-size="13">网络诊断在本机发起；终端、文件操作及监控通过远程连接完成</text>
  <text x="600" y="573" text-anchor="middle" fill="#91a2b5" font-size="11">NexaShell · Cross-platform server operations client</text>
