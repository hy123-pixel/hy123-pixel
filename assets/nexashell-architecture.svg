  <filter id="soft" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#18345d" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5c91c9"/></marker>
</defs>
<rect width="1200" height="610" rx="24" fill="#f4f7fb"/>
<path d="M24 0h1152a24 24 0 0 1 24 24v92H0V24A24 24 0 0 1 24 0" fill="url(#header)"/>
