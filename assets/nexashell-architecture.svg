<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">NexaShell feature and connection diagram</title>
<desc id="desc">A user works from the NexaShell desktop client. SSH connects to remote servers for terminal, SFTP, monitoring, and port forwarding. Network diagnostics run from the local computer.</desc>
<defs>
