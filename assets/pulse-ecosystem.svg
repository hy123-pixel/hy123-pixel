<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PulseCN 与 Pulse Pro 日志调试流程</title>
  <desc id="desc">PulseCN 在 iPhone 或 iPad 上记录应用日志和 URLSession 网络事件，并发送到 macOS 版 Pulse Pro 实时查看与分析。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="20" r="230" fill="#2563eb" opacity=".10"/>
  <circle cx="40" cy="500" r="230" fill="#8b5cf6" opacity=".10"/>
  <text x="64" y="72" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="30" font-weight="700">Pulse 日志调试流程</text>
  <text x="64" y="108" fill="#a5b4fc" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="17">设备采集 · 本地存储 · 远程调试</text>
  <g filter="url(#shadow)">
    <rect x="64" y="154" width="438" height="290" rx="20" fill="#1e293b" stroke="#334155"/>
    <rect x="698" y="154" width="438" height="290" rx="20" fill="#1e293b" stroke="#334155"/>
  </g>
  <g transform="translate(92 185)">
    <rect width="48" height="48" rx="14" fill="#2563eb"/>
    <path d="M9 25h8l5-11 8 23 5-12h5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="21" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="23" font-weight="700">PulseCN</text>
    <text x="64" y="44" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14">iOS · iPadOS · Swift 软件包</text>
    <rect x="0" y="78" width="382" height="1" fill="#334155"/>
    <circle cx="9" cy="112" r="4" fill="#60a5fa"/><text x="24" y="117" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16">应用日志与诊断信息</text>
    <circle cx="9" cy="151" r="4" fill="#60a5fa"/><text x="24" y="156" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16">URLSession request events</text>
    <circle cx="9" cy="190" r="4" fill="#60a5fa"/><text x="24" y="195" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16">应用内控制台与本地日志</text>
    <text x="0" y="244" fill="#93c5fd" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14">Pulse 框架中文本地化版本</text>
  </g>
  <g transform="translate(726 185)">
    <rect width="48" height="48" rx="14" fill="#7c3aed"/>
    <path d="M9 25h8l5-11 8 23 5-12h5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="21" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="23" font-weight="700">Pulse Pro</text>
    <text x="64" y="44" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14">macOS · 桌面日志查看工具</text>
    <rect x="0" y="78" width="382" height="1" fill="#334155"/>
    <circle cx="9" cy="112" r="4" fill="#a78bfa"/><text x="24" y="117" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16">接收设备实时发送的日志</text>
    <circle cx="9" cy="151" r="4" fill="#a78bfa"/><text x="24" y="156" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16">分析请求、请求头与耗时</text>
    <circle cx="9" cy="190" r="4" fill="#a78bfa"/><text x="24" y="195" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16">打开并导出本地 .pulse 日志包</text>
    <text x="0" y="244" fill="#c4b5fd" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14">配套的日志调试工作台</text>
  </g>
  <path d="M526 298h148" stroke="url(#pulse)" stroke-width="4" stroke-linecap="round"/>
  <path d="m658 286 16 12-16 12" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="272" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">远程传输</text>
  <text x="600" y="490" text-anchor="middle" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">PulseCN 与 Pulse Pro 是 Pulse 日志工具生态中的配套项目</text>
</svg>
