<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PulseCN and Pulse Pro logging workflow</title>
  <desc id="desc">PulseCN records app logs and URLSession network events on iPhone or iPad, then streams them to Pulse Pro on macOS for live viewing and request inspection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="20" r="230" fill="#2563eb" opacity=".10"/>
  <circle cx="40" cy="500" r="230" fill="#8b5cf6" opacity=".10"/>
  <text x="64" y="72" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="30" font-weight="700">Pulse logging workflow</text>
  <text x="64" y="108" fill="#a5b4fc" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="17">On-device capture · Local storage · Remote debugging</text>
  <g filter="url(#shadow)">
    <rect x="64" y="154" width="438" height="290" rx="20" fill="#1e293b" stroke="#334155"/>
    <rect x="698" y="154" width="438" height="290" rx="20" fill="#1e293b" stroke="#334155"/>
  </g>
  <g transform="translate(92 185)">
    <rect width="48" height="48" rx="14" fill="#2563eb"/>
    <path d="M9 25h8l5-11 8 23 5-12h5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="21" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="23" font-weight="700">PulseCN</text>
    <text x="64" y="44" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14">iOS · iPadOS · Swift Package</text>
    <rect x="0" y="78" width="382" height="1" fill="#334155"/>
    <circle cx="9" cy="112" r="4" fill="#60a5fa"/><text x="24" y="117" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16">App logs and diagnostics</text>
    <circle cx="9" cy="151" r="4" fill="#60a5fa"/><text x="24" y="156" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16">URLSession request events</text>
    <circle cx="9" cy="190" r="4" fill="#60a5fa"/><text x="24" y="195" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16">In-app console and local logs</text>
    <text x="0" y="244" fill="#93c5fd" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14">Chinese-localized Pulse framework</text>
  </g>
  <g transform="translate(726 185)">
    <rect width="48" height="48" rx="14" fill="#7c3aed"/>
    <path d="M9 25h8l5-11 8 23 5-12h5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="21" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="23" font-weight="700">Pulse Pro</text>
    <text x="64" y="44" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14">macOS · Desktop log viewer</text>
    <rect x="0" y="78" width="382" height="1" fill="#334155"/>
    <circle cx="9" cy="112" r="4" fill="#a78bfa"/><text x="24" y="117" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16">Receive live logs from devices</text>
    <circle cx="9" cy="151" r="4" fill="#a78bfa"/><text x="24" y="156" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16">Inspect requests, headers and timing</text>
    <circle cx="9" cy="190" r="4" fill="#a78bfa"/><text x="24" y="195" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16">Open and export local .pulse logs</text>
    <text x="0" y="244" fill="#c4b5fd" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14">A companion debugging workspace</text>
  </g>
  <path d="M526 298h148" stroke="url(#pulse)" stroke-width="4" stroke-linecap="round"/>
  <path d="m658 286 16 12-16 12" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="272" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Remote stream</text>
  <text x="600" y="490" text-anchor="middle" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">PulseCN and Pulse Pro are companion projects in the Pulse ecosystem</text>
</svg>
